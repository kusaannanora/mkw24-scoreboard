<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MKW24 — レース中の集計</title>
  <link rel="stylesheet" href="style.css?v=coin-hud-3">

  <style>
    /* 配置・サイズは既存設定を使用 */
    body.race-overlay .broadcast {
      background: transparent;
      border: none;
      box-shadow: none;
    }

    /* コイン表示に合わせた半透明背景・二重縁 */
    body.race-overlay .broadcast-header,
    body.race-overlay .broadcast .score-row,
    body.race-overlay .broadcast .score-row:first-of-type {
      background: rgba(28, 25, 22, .65);
      border: 4px solid rgba(81, 62, 49, .85);
      border-radius: 16px;
      box-shadow:
        inset 0 0 0 2px rgba(225, 218, 205, .42),
        inset 0 0 0 4px rgba(25, 20, 16, .48),
        0 0 0 1px rgba(235, 225, 207, .28);
      box-sizing: border-box;
    }

    body.race-overlay .broadcast .score-row {
      padding: 0 10px;
      align-items: center;
    }

    body.race-overlay .broadcast-header {
      padding: 3px 10px;
      border-radius: 13px;
    }

    body.race-overlay .race-badge {
      color: #fff;
    }

    body.race-overlay .broadcast .score-row .tagname,
    body.race-overlay .broadcast .score-row .rank,
    body.race-overlay .broadcast .score-row .score {
      opacity: 1;
      text-shadow:
        0 2px 2px rgba(0, 0, 0, .65),
        0 0 1px rgba(0, 0, 0, .8);
    }
  </style>
</head>
<body class="overlay race-overlay">
  <div id="app"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
