<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MKW24 — レース中の集計</title>
  <link rel="stylesheet" href="style.css?v=coin-hud-name-5">
  <style>
    /* Keep the approved placement, dimensions and transparency. */
    body.race-overlay .broadcast {
      background: transparent;
      border: none;
      box-shadow: none;
    }

    /* Neutral black and white: no brown tint. */
    body.race-overlay .broadcast-header,
    body.race-overlay .broadcast .score-row,
    body.race-overlay .broadcast .score-row:first-of-type {
      background: rgba(28, 28, 28, .65);
      border: 4px solid rgba(65, 65, 65, .85);
      border-radius: 16px;
      box-shadow:
        inset 0 0 0 2px rgba(218, 218, 218, .42),
        inset 0 0 0 4px rgba(21, 21, 21, .48),
        0 0 0 1px rgba(225, 225, 225, .28);
      box-sizing: border-box;
    }

    body.race-overlay .broadcast .score-row {
      padding: 0 10px;
      align-items: center;
    }

    body.race-overlay .broadcast-header {
      padding: 3px 10px;
      border-radius: 13px;
    }

    body.race-overlay .race-badge {
      color: #fff;
    }

    body.race-overlay .broadcast .score-row .tagname,
    body.race-overlay .broadcast .score-row .rank,
    body.race-overlay .broadcast .score-row .score {
      opacity: 1;
      text-shadow:
        0 2px 2px rgba(0, 0, 0, .65),
        0 0 1px rgba(0, 0, 0, .8);
    }
    /* Team names close to the size of the in-game coin counter. */
    body.race-overlay .broadcast .score-row,
    body.race-overlay .broadcast .score-row:first-of-type {
      height: 56px;
      min-height: 56px;
    }
    body.race-overlay .broadcast .score-row .tagname {
      font-size: 46px;
      line-height: 1;
      font-weight: 800;
    }
    /* Keep twelve teams below the item display and above the coin HUD. */
    body.race-overlay .broadcast:has(.score-row:nth-of-type(n+12)) .score-row {
      height: 48px;
      min-height: 48px;
    }
    body.race-overlay .broadcast:has(.score-row:nth-of-type(n+12)) .score-row .tagname {
      font-size: 38px;
    }
  </style>
</head>
<body class="overlay race-overlay">
  <div id="app"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
